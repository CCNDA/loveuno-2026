# 新版愛諾園公測 beta.loveuno.com（熊叔叔 11/17 TG 選「甲 beta.loveuno.com」；Asana 1220564106252789）
# 放 /etc/nginx/sites-available/beta.loveuno.com、sites-enabled 連過去（由 deploy/vm10-beta-setup.sh 安裝）
# 憑證沿用 loveuno.com 的 Cloudflare Origin（SAN 含 *.loveuno.com）
server {
    listen 80;
    listen [::]:80;
    server_name beta.loveuno.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beta.loveuno.com;

    ssl_certificate /home/ubuntu/ssl/loveuno.com.crt;
    ssl_certificate_key /home/ubuntu/ssl/loveuno.com.key;
    include snippets/cloudflare-realip.conf;

    root /home/ubuntu/loveuno-2026/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    error_log /var/log/nginx/beta.loveuno.com-error.log;
    access_log /var/log/nginx/beta.loveuno.com-access.log;

    # 點開頭的檔（.env、.git…）一律不給；.well-known 例外
    location ~ /\.(?!well-known) { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 只執行 Laravel 的入口；public/ 底下其他 .php（例如上傳誤放）一律不執行
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ \.php$ { return 404; }
}
